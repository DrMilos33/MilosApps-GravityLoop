name: Gravity Loop CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify pinned public app shell
        run: pnpm verify:shell

      - name: Verify pinned public app essentials
        run: pnpm verify:essentials

      - name: Unit tests
        run: pnpm test

      - name: Production build
        run: pnpm build

      - name: Upload production candidate
        uses: actions/upload-artifact@v4
        with:
          name: gravity-loop-production-${{ github.sha }}
          path: dist
          if-no-files-found: error
          retention-days: 14

      - name: Install browser engines
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      - name: Browser tests
        run: pnpm test:e2e
